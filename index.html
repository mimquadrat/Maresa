<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Maresa">
<meta name="theme-color" content="#ff4fa3">
<link rel="apple-touch-icon" href="img/maresa.jpg">
<link rel="icon" href="img/maresa.jpg">
<title>Maresas Spielewelt</title>
<link rel="stylesheet" href="css/style.css?v=5">
</head>
<body>

<div id="start" class="screen active">
  <div class="hero"><div class="crown">👑</div><img src="img/maresa.jpg" alt="Maresa"></div>
  <h1>Maresas Spielewelt</h1>
  <p>Hallo Maresa! 👋 Wer willst du heute sein?</p>
  <div class="stats"><div id="treasureCount">💰 0 Schätze</div><div id="riddleCount">⭐ 0 Aufgaben</div></div>
  <div class="modes">
    <button class="mode" data-m="math">🔢 Rechnen</button>
    <button class="mode" data-m="read">🔤 Lesen</button>
    <button class="mode" data-m="both">⭐ Beides</button>
  </div>
  <div class="animals">
    <button class="animal" data-a="🦄">🦄<span>Einhorn</span></button>
    <button class="animal" data-a="🐊">🐊<span>Krokodil</span></button>
    <button class="animal" data-a="🐯">🐯<span>Tiger</span></button>
    <button class="animal" data-a="🦩">🦩<span>Flamingo</span></button>
    <button class="animal" data-a="🐰">🐰<span>Hase</span></button>
    <button class="animal" data-a="ME"><img src="img/maresa.jpg" alt=""><span>Ich selbst!</span></button>
  </div>
  <p style="font-size:.9rem; opacity:.75;">Tipp auf ein Tier, dann geht's zur Schatzkarte 🗺️</p>
</div>

<div id="map" class="screen">
  <div class="bar">
    <button class="btn" id="mapHome">🏠</button>
    <div class="mid"><img src="img/maresa.jpg" alt=""><span>Schatzkarte</span></div>
    <div class="hud" id="mapStation">Station 1</div>
  </div>
  <div id="mapScroll"><div id="mapInner"></div></div>
</div>

<div id="game" class="screen">
  <div class="bar">
    <button class="btn" id="gMap">🗺️</button>
    <button class="btn pink" id="gPet" aria-label="Tier wechseln">🐾</button>
    <div class="mid"><span id="gTitle"></span></div>
    <div class="hud" id="hud"></div>
  </div>
  <div id="stage"></div>
</div>

<div id="quiz">
  <div class="qcard">
    <div class="qhead"><span id="qtitle">🔑 Schlüssel-Rätsel</span><button class="speak" id="speak" aria-label="Vorlesen">🔊</button></div>
    <div class="qtext" id="qtext"></div>
    <div class="qvis" id="qvis"></div>
    <div class="opts" id="opts"></div>
    <div class="feedback" id="feedback"></div>
  </div>
</div>

<div id="party">
  <div class="bg"></div>
  <div class="rays"></div>
  <canvas id="fx"></canvas>
  <div class="partybox">
    <div class="star-photo">
      <div class="ring"></div><div class="ring r2"></div><div class="ring r3"></div>
      <img src="img/maresa.jpg" alt="Maresa">
      <div class="crown">👑</div>
      <div class="chest">💰</div>
      <div class="pet" id="partyPet">🦄</div>
    </div>
    <div class="headline" id="headline"></div>
    <div class="praise" id="praise">Wahnsinn!</div>
    <div class="count" id="partyCount"></div>
    <div class="partybtns">
      <button class="btn pink" id="next">Weiter zur Karte 🗺️</button>
      <button class="btn" id="again">Nochmal spielen 🔄</button>
    </div>
  </div>
</div>

<script src="js/core.js?v=5"></script>
<script src="js/games/labyrinth.js?v=5"></script>
<script src="js/games/bubbles.js?v=5"></script>
<script src="js/games/memory.js?v=5"></script>
<script src="js/games/hop.js?v=5"></script>
<script src="js/games/catch.js?v=5"></script>
<script src="js/games/train.js?v=5"></script>
<script src="js/games/bakery.js?v=5"></script>
<script src="js/games/paint.js?v=5"></script>
</body>
</html>
