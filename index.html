<title>Maresas Labyrinth</title>
<style>
  :root {
    --card: #ffffff;
    --accent: #b05cff;
    --accent2: #ff4fa3;
    --text: #3a2350;
    --wall: #5b3a8a;
    --floor: #fff8e7;
    --trail: rgba(255, 79, 163, 0.35);
    --good: #2fbf71;
    --red: #e8413c;
    --blue: #2f7fe0;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; height: 100%;
    background: linear-gradient(180deg, #ffe3f3 0%, #e8f4ff 100%);
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    color: var(--text);
    overflow: hidden; touch-action: none;
    user-select: none; -webkit-user-select: none;
  }
  .screen { position: absolute; inset: 0; display: none; flex-direction: column; align-items: center;
    padding: max(16px, env(safe-area-inset-top)) 16px max(16px, env(safe-area-inset-bottom)); }
  .screen.active { display: flex; }

  /* ---------- Start ---------- */
  #start { justify-content: center; gap: 12px; text-align: center; overflow-y: auto; }
  .hero { position: relative; width: 130px; height: 130px; flex: none; margin-top: 26px; }
  .hero img {
    width: 130px; height: 130px; border-radius: 50%; object-fit: cover;
    border: 6px solid #fff; box-shadow: 0 0 0 5px var(--accent2), 0 8px 24px rgba(255,79,163,.4);
    animation: wobble 3s ease-in-out infinite;
  }
  .hero .crown { position: absolute; top: -34px; left: 50%; transform: translateX(-50%) rotate(-8deg); font-size: 3rem; animation: crownbob 1.5s ease-in-out infinite; }
  @keyframes wobble { 0%,100% { transform: rotate(-4deg); } 50% { transform: rotate(4deg); } }
  @keyframes crownbob { 0%,100% { transform: translateX(-50%) translateY(0) rotate(-8deg); } 50% { transform: translateX(-50%) translateY(-6px) rotate(8deg); } }
  #start h1 { margin: 4px 0 0; font-size: 1.9rem; background: linear-gradient(90deg,#ff4fa3,#b05cff,#4fa3ff); -webkit-background-clip: text; background-clip: text; color: transparent; }
  #start p { margin: 0; font-size: 1.1rem; }
  .stats { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
  .stats div { font-weight: 700; font-size: .95rem; background: #fff; padding: 6px 12px; border-radius: 99px; box-shadow: 0 3px 10px rgba(91,58,138,.15); }
  .modes { display: flex; gap: 8px; }
  .mode { border: 3px solid transparent; background: #fff; border-radius: 99px; padding: 8px 14px; font-size: 1rem; font-weight: 700; color: var(--text); box-shadow: 0 3px 10px rgba(91,58,138,.15); cursor: pointer; }
  .mode.on { border-color: var(--accent2); background: #ffe3f3; }
  .animals { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; width: 100%; max-width: 380px; }
  .animal {
    background: var(--card); border: 3px solid transparent; border-radius: 20px;
    padding: 8px 4px; font-size: 2.6rem; cursor: pointer; line-height: 1.1;
    box-shadow: 0 4px 12px rgba(91, 58, 138, 0.15);
    display: flex; flex-direction: column; align-items: center; gap: 4px;
  }
  .animal img { width: 46px; height: 46px; border-radius: 50%; object-fit: cover; border: 3px solid var(--accent2); }
  .animal span { font-size: .9rem; font-weight: 600; color: var(--text); }
  .animal:active { transform: scale(.94); border-color: var(--accent2); }

  /* ---------- Spiel ---------- */
  #game { gap: 10px; }
  .bar { width: 100%; max-width: 520px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .bar .mid { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 1.05rem; }
  .bar .mid img { width: 34px; height: 34px; border-radius: 50%; object-fit: cover; border: 2px solid var(--accent2); }
  .keys { font-size: 1.3rem; letter-spacing: 2px; }
  .keys .gone { opacity: .25; filter: grayscale(1); }
  .btn { background: var(--accent); color: #fff; border: none; border-radius: 14px; padding: 10px 16px; font-size: 1rem; font-weight: 700; cursor: pointer; }
  .btn.pink { background: var(--accent2); }
  .btn:active { transform: scale(.95); }
  #wrap { flex: 1; width: 100%; display: flex; align-items: center; justify-content: center; min-height: 0; }
  #c { background: var(--floor); border-radius: 12px; box-shadow: 0 6px 18px rgba(91, 58, 138, 0.2); }
  .pad { display: grid; grid-template-columns: repeat(3, 64px); grid-template-rows: repeat(2, 64px); gap: 8px; }
  .pad button { font-size: 1.8rem; border: none; border-radius: 16px; background: var(--card); box-shadow: 0 3px 10px rgba(91, 58, 138, 0.18); color: var(--accent); cursor: pointer; }
  .pad button:active { background: #ffe3f3; }
  .pad .up { grid-column: 2; grid-row: 1; } .pad .left { grid-column: 1; grid-row: 2; }
  .pad .down { grid-column: 2; grid-row: 2; } .pad .right { grid-column: 3; grid-row: 2; }
  .toast { position: fixed; left: 50%; top: 20%; transform: translateX(-50%); background: #fff; color: var(--text); font-weight: 800; font-size: 1.2rem; padding: 14px 20px; border-radius: 18px; box-shadow: 0 8px 24px rgba(0,0,0,.2); z-index: 30; text-align: center; animation: pop .3s ease-out; max-width: 90vw; }
  @keyframes pop { from { transform: translateX(-50%) scale(.5); opacity: 0; } to { transform: translateX(-50%) scale(1); opacity: 1; } }

  /* ---------- Rätsel ---------- */
  #quiz { position: fixed; inset: 0; z-index: 15; display: none; align-items: center; justify-content: center; background: rgba(58,35,80,.55); padding: 16px; }
  #quiz.active { display: flex; }
  .qcard { background: #fff; border-radius: 26px; padding: 18px 16px 20px; width: 100%; max-width: 420px; max-height: 100%; overflow-y: auto; text-align: center; box-shadow: 0 12px 34px rgba(0,0,0,.3); animation: qin .35s cubic-bezier(.2,1.5,.4,1); }
  @keyframes qin { from { transform: scale(.6) rotate(-6deg); opacity: 0; } to { transform: scale(1) rotate(0); opacity: 1; } }
  .qhead { display: flex; align-items: center; justify-content: space-between; font-weight: 800; color: var(--accent); font-size: 1.05rem; }
  .speak { border: none; background: #ffe3f3; border-radius: 50%; width: 52px; height: 52px; font-size: 1.6rem; cursor: pointer; flex: none; }
  .speak:active { transform: scale(.9); }
  .qtext { font-size: 1.25rem; font-weight: 700; margin: 10px 0 12px; line-height: 1.3; }
  .qvis { min-height: 110px; display: flex; align-items: center; justify-content: center; flex-wrap: wrap; gap: 10px; margin-bottom: 14px; }
  .big-emoji { font-size: 5rem; line-height: 1; }
  .opts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .opt { border: none; border-radius: 18px; min-height: 78px; font-size: 2.2rem; font-weight: 800; color: var(--text); background: #f3e9ff; box-shadow: 0 4px 0 #d6c1f5; cursor: pointer; font-family: inherit; }
  .opt small { font-size: 1.3rem; font-weight: 600; opacity: .7; }
  .opt:active { transform: translateY(3px); box-shadow: 0 1px 0 #d6c1f5; }
  .opt.right { background: var(--good); color: #fff; box-shadow: 0 4px 0 #1f8a50; animation: yay .5s ease; }
  .opt.wrong { background: #ffd6d6; animation: nope .4s ease; }
  .opt.hint { animation: hint 1s ease-in-out infinite; }
  @keyframes yay { 50% { transform: scale(1.18) rotate(-4deg); } }
  @keyframes nope { 20%,60% { transform: translateX(-8px); } 40%,80% { transform: translateX(8px); } }
  @keyframes hint { 50% { box-shadow: 0 0 0 6px #fff34f, 0 4px 0 #d6c1f5; transform: scale(1.06); } }
  .feedback { min-height: 1.6em; font-weight: 800; font-size: 1.15rem; margin-top: 12px; }

  .dice { width: 96px; height: 96px; background: #fff; border: 4px solid var(--text); border-radius: 18px; display: grid; grid-template: repeat(3,1fr) / repeat(3,1fr); padding: 8px; }
  .dice i { display: block; border-radius: 50%; margin: 3px; }
  .dice i.on { background: var(--text); }
  .field { display: grid; grid-template-columns: repeat(5, 34px); grid-auto-rows: 34px; border: 3px solid var(--text); background: #fff; border-radius: 6px; }
  .field b { border: 1px solid #c9b8e0; display: flex; align-items: center; justify-content: center; }
  .field b::after { content: ""; width: 24px; height: 24px; border-radius: 50%; }
  .field b.r::after { background: var(--red); }
  .field b.u::after { background: var(--blue); }
  .house { display: flex; flex-direction: column; align-items: center; }
  .roof { width: 170px; height: 70px; background: #f08a4b; clip-path: polygon(50% 0, 100% 100%, 0 100%); display: flex; align-items: flex-end; justify-content: center; padding-bottom: 6px; font-size: 2rem; font-weight: 900; color: #fff; }
  .floor { display: grid; grid-template-columns: 1fr 1fr; width: 140px; border: 3px solid var(--text); border-top: none; background: #fff; }
  .floor span { height: 58px; display: flex; align-items: center; justify-content: center; font-size: 2.2rem; font-weight: 900; }
  .floor span + span { border-left: 3px solid var(--text); }
  .q { color: var(--accent2); }
  .sum { font-size: 2.6rem; font-weight: 900; letter-spacing: 2px; }
  .dotsrow { display: flex; gap: 4px; flex-wrap: wrap; justify-content: center; width: 100%; }
  .dotsrow i { width: 22px; height: 22px; border-radius: 50%; }
  .dotsrow i.r { background: var(--red); } .dotsrow i.u { background: var(--blue); }
  .boxes { display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; }
  .boxes span { width: 42px; height: 50px; border: 3px solid #e58bb8; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 1.7rem; font-weight: 800; background: #fff; }
  .boxes span.q { background: #ffe3f3; }
  .word { font-size: 3rem; font-weight: 900; letter-spacing: 6px; }

  /* ---------- MEGA-PARTY ---------- */
  #party { position: fixed; inset: 0; z-index: 20; display: none; overflow: hidden; }
  #party.active { display: block; }
  #party .bg { position: absolute; inset: 0; background: conic-gradient(from 0deg, #ff4fa3, #ffb84f, #fff34f, #4fff8a, #4fd2ff, #b05cff, #ff4fa3); animation: spinbg 4s linear infinite; transform: scale(2.2); opacity: .9; }
  #party .rays { position: absolute; inset: -50%; background: repeating-conic-gradient(rgba(255,255,255,.35) 0deg 10deg, transparent 10deg 20deg); animation: spinbg 8s linear infinite reverse; }
  @keyframes spinbg { to { transform: scale(2.2) rotate(360deg); } }
  #fx { position: absolute; inset: 0; pointer-events: none; }
  .partybox { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 16px; text-align: center; }
  .star-photo { position: relative; width: 200px; height: 200px; animation: zoomin .8s cubic-bezier(.2,1.6,.4,1) both, bounce 1s ease-in-out .8s infinite; }
  .star-photo img { width: 200px; height: 200px; border-radius: 50%; object-fit: cover; border: 8px solid #fff; animation: glow 0.6s ease-in-out infinite alternate; }
  .star-photo .crown { position: absolute; top: -58px; left: 50%; font-size: 5rem; transform: translateX(-50%); animation: crownbob 0.8s ease-in-out infinite; }
  .star-photo .pet { position: absolute; bottom: -18px; right: -26px; font-size: 4rem; animation: dance .5s ease-in-out infinite alternate; }
  .star-photo .chest { position: absolute; bottom: -18px; left: -26px; font-size: 4rem; animation: dance .5s ease-in-out infinite alternate-reverse; }
  .ring { position: absolute; inset: -10px; border-radius: 50%; border: 6px solid #fff; animation: ring 1.2s ease-out infinite; }
  .ring.r2 { animation-delay: .4s; } .ring.r3 { animation-delay: .8s; }
  @keyframes ring { from { transform: scale(1); opacity: .9; } to { transform: scale(2.2); opacity: 0; } }
  @keyframes zoomin { from { transform: scale(0) rotate(-720deg); } to { transform: scale(1) rotate(0); } }
  @keyframes bounce { 0%,100% { transform: translateY(0) scale(1); } 50% { transform: translateY(-16px) scale(1.06); } }
  @keyframes glow { from { box-shadow: 0 0 20px 6px #fff34f, 0 0 60px 20px #ff4fa3; } to { box-shadow: 0 0 40px 14px #4fd2ff, 0 0 90px 30px #b05cff; } }
  @keyframes dance { from { transform: rotate(-20deg) scale(1); } to { transform: rotate(20deg) scale(1.25); } }
  .headline { font-size: 2.1rem; font-weight: 900; line-height: 1.1; margin-top: 18px; text-shadow: 0 4px 0 rgba(0,0,0,.2); }
  .headline span { display: inline-block; animation: letter .6s ease-in-out infinite alternate; }
  @keyframes letter { from { transform: translateY(0) rotate(-6deg); } to { transform: translateY(-12px) rotate(6deg); } }
  .praise { font-size: 1.25rem; font-weight: 800; color: #fff; background: rgba(58,35,80,.55); padding: 8px 18px; border-radius: 99px; animation: pulse .7s ease-in-out infinite alternate; }
  @keyframes pulse { from { transform: scale(1); } to { transform: scale(1.1); } }
  .count { font-size: 1.1rem; font-weight: 800; color: #fff; text-shadow: 0 2px 0 rgba(0,0,0,.3); }
  .partybtns { display: flex; flex-direction: column; gap: 10px; width: 100%; max-width: 300px; opacity: 0; animation: fadein .5s ease 2.2s forwards; }
  .partybtns .btn { padding: 14px; font-size: 1.15rem; box-shadow: 0 4px 0 rgba(0,0,0,.2); }
  @keyframes fadein { to { opacity: 1; } }
  .shake { animation: shake .5s ease-in-out 3; }
  @keyframes shake { 0%,100% { transform: translate(0,0); } 20% { transform: translate(-10px,6px) rotate(-1deg); } 40% { transform: translate(10px,-6px) rotate(1deg); } 60% { transform: translate(-8px,-4px); } 80% { transform: translate(8px,4px); } }
  .rain { position: absolute; top: -60px; pointer-events: none; animation: fall linear forwards; }
  @keyframes fall { to { transform: translateY(115vh) rotate(720deg); } }
  .flash { position: absolute; inset: 0; background: #fff; animation: flash .5s ease-out forwards; pointer-events: none; }
  @keyframes flash { from { opacity: 1; } to { opacity: 0; } }
  .pop { position: fixed; font-size: 2.4rem; pointer-events: none; z-index: 40; animation: popfly 1s ease-out forwards; }
  @keyframes popfly { to { transform: translate(var(--dx), var(--dy)) scale(.4) rotate(360deg); opacity: 0; } }
</style>
</head>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const canvas = $('c'), ctx = canvas.getContext('2d'), face = $('faceImg');
  const DX = [0, 1, 0, -1], DY = [-1, 0, 1, 0];
  const rnd = n => Math.floor(Math.random() * n);
  const pick = a => a[rnd(a.length)];
  const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = rnd(i + 1); [a[i], a[j]] = [a[j], a[i]]; } return a; };

  let animal = '🦄', level = 1;
  let cols, rows, walls, player, goal, trail, cell, keys = [], keysTotal = 0;
  let busy = false;

  // ---------- Speicher ----------
  const store = {
    get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : v; } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  };
  let treasures = parseInt(store.get('maresaSchaetze', '0'), 10) || 0;
  let riddles = parseInt(store.get('maresaRaetsel', '0'), 10) || 0;
  let mode = store.get('maresaModus', 'both');
  function showStats() {
    $('treasureCount').textContent = '💰 ' + treasures + (treasures === 1 ? ' Schatz' : ' Schätze');
    $('riddleCount').textContent = '🔑 ' + riddles + ' Rätsel';
  }
  showStats();
  document.querySelectorAll('.mode').forEach(b => {
    b.classList.toggle('on', b.dataset.m === mode);
    b.onclick = () => { mode = b.dataset.m; store.set('maresaModus', mode); document.querySelectorAll('.mode').forEach(x => x.classList.toggle('on', x === b)); };
  });

  function show(id) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    $(id).classList.add('active');
  }

  // ---------- Vorlesen ----------
  let voice = null;
  function pickVoice() {
    try {
      const vs = speechSynthesis.getVoices().filter(v => v.lang && v.lang.toLowerCase().startsWith('de'));
      voice = vs.find(v => /anna|petra|helena|marlene|female/i.test(v.name)) || vs[0] || null;
    } catch (e) {}
  }
  try { pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; } catch (e) {}
  function say(text, rate = 0.9) {
    try {
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.lang = 'de-DE'; u.rate = rate; u.pitch = 1.1;
      if (voice) u.voice = voice;
      speechSynthesis.speak(u);
    } catch (e) {}
  }

  // ---------- Sound ----------
  let ac = null;
  function audio() { try { if (!ac) ac = new (window.AudioContext || window.webkitAudioContext)(); if (ac.state === 'suspended') ac.resume(); } catch (e) {} return ac; }
  function tone(freq, start, dur, type = 'triangle', vol = 0.18) {
    const a = audio(); if (!a) return;
    const o = a.createOscillator(), g = a.createGain();
    o.type = type; o.frequency.value = freq;
    g.gain.setValueAtTime(0, a.currentTime + start);

  // ---------- Labyrinth ----------
  function generate() {
    cols = Math.min(5 + level, 11);
    rows = Math.min(7 + level, 15);
    walls = [];
    for (let y = 0; y < rows; y++) { walls.push([]); for (let x = 0; x < cols; x++) walls[y].push([true, true, true, true]); }
    const seen = walls.map(r => r.map(() => false));
    const stack = [[0, 0]]; seen[0][0] = true;
    while (stack.length) {
      const [x, y] = stack[stack.length - 1];
      const opts = [];
      for (let d = 0; d < 4; d++) {
        const nx = x + DX[d], ny = y + DY[d];
        if (nx >= 0 && ny >= 0 && nx < cols && ny < rows && !seen[ny][nx]) opts.push(d);
      }
      if (!opts.length) { stack.pop(); continue; }
      const d = pick(opts);
      const nx = x + DX[d], ny = y + DY[d];
      walls[y][x][d] = false; walls[ny][nx][(d + 2) % 4] = false;
      seen[ny][nx] = true; stack.push([nx, ny]);
    }
    player = { x: 0, y: 0 }; goal = { x: cols - 1, y: rows - 1 }; trail = [{ x: 0, y: 0 }];
    placeKeys(Math.min(level, 3));
    $('level').textContent = 'Level ' + level;
    resize();
  }

  // Schlüssel bevorzugt in Sackgassen verstecken
  function placeKeys(n) {
    keysTotal = n; keys = [];
    const cand = [];
    for (let y = 0; y < rows; y++) for (let x = 0; x < cols; x++) {
      if ((x === 0 && y === 0) || (x === goal.x && y === goal.y)) continue;
      if (x + y < 3) continue;
      const open = walls[y][x].filter(w => !w).length;
      cand.push({ x, y, dead: open === 1 });
    }
    const ordered = shuffle(cand.filter(c => c.dead)).concat(shuffle(cand.filter(c => !c.dead)));
    for (const c of ordered) {
      if (keys.length >= n) break;
      if (keys.every(k => Math.abs(k.x - c.x) + Math.abs(k.y - c.y) >= 4)) keys.push({ x: c.x, y: c.y });
    }
    renderKeys();
  }
  function renderKeys() {
    const found = keysTotal - keys.length;
    let h = '';
    for (let i = 0; i < keysTotal; i++) h += i < found ? '🔑' : '<span class="gone">🔑</span>';
    $('keys').innerHTML = h;
  }

  function resize() {
    const wrap = $('wrap');

    const dpr = window.devicePixelRatio || 1;

    canvas.width = cell * cols * dpr; canvas.height = cell * rows * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    draw();

  let t0 = performance.now();
  function draw() {
    if (!walls) return;
    ctx.clearRect(0, 0, cols * cell, rows * cell);
    const css = getComputedStyle(document.documentElement);
    ctx.fillStyle = css.getPropertyValue('--trail');
    trail.forEach(p => { ctx.beginPath(); ctx.arc(p.x * cell + cell / 2, p.y * cell + cell / 2, cell * 0.18, 0, Math.PI * 2); ctx.fill(); });

    ctx.strokeStyle = css.getPropertyValue('--wall');
    ctx.lineWidth = Math.max(2, cell * 0.09); ctx.lineCap = 'round';
    ctx.beginPath();
    const inset = ctx.lineWidth / 2;
    for (let y = 0; y < rows; y++) for (let x = 0; x < cols; x++) {
      const px = x * cell, py = y * cell, w = walls[y][x];
      const x0 = Math.max(px, inset), y0 = Math.max(py, inset);
      const x1 = Math.min(px + cell, cols * cell - inset), y1 = Math.min(py + cell, rows * cell - inset);
      if (w[0]) { ctx.moveTo(x0, y0); ctx.lineTo(x1, y0); }
      if (w[1]) { ctx.moveTo(x1, y0); ctx.lineTo(x1, y1); }
      if (w[2]) { ctx.moveTo(x0, y1); ctx.lineTo(x1, y1); }
      if (w[3]) { ctx.moveTo(x0, y0); ctx.lineTo(x0, y1); }
    }
    ctx.stroke();

    ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillStyle = '#000';
    const bob = Math.sin((performance.now() - t0) / 250) * cell * 0.06;
    ctx.font = Math.floor(cell * 0.62) + 'px sans-serif';
    keys.forEach(k => ctx.fillText('🔑', k.x * cell + cell / 2, k.y * cell + cell / 2 + bob));

    ctx.font = Math.floor(cell * 0.7) + 'px sans-serif';
    const gx = goal.x * cell + cell / 2, gy = goal.y * cell + cell / 2;
    ctx.fillText('💰', gx, gy + cell * 0.04);

    const cx = player.x * cell + cell / 2, cy = player.y * cell + cell / 2;
    if (animal === 'ME') {
      const r = cell * 0.4;
      ctx.save(); ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.closePath(); ctx.clip();

    } else {

    }
  }

    setTimeout(() => say('Maresa hat den Schatz gefunden! ' + pr.replace(/[^\p{L}\p{N}\s!,'’]/gu, ''), 1), 2600);
    sizeFx(); running = true; loop();
    confetti(200); emojiRain(60);
    let shots = 0;
    const timer = setInterval(() => {
      burst(Math.random() * innerWidth, innerHeight * (0.15 + Math.random() * 0.45));
      if (shots % 3 === 0) confetti(40);
      if (++shots > 22) { clearInterval(timer); running = false; }
    }, 280);
    p._timer = timer;
  }
  function endParty() {
    const p = $('party');
    clearInterval(p._timer); running = false; parts = [];
    p.classList.remove('active');
    p.querySelectorAll('.rain').forEach(e => e.remove());
    try { speechSynthesis.cancel(); } catch (e) {}
    busy = false;
  }

  // ---------- Steuerung ----------
  document.querySelectorAll('.animal').forEach(b => b.addEventListener('click', () => {
    animal = b.dataset.a; level = 1; audio(); busy = false; show('game'); generate();
    say(level === 1 ? 'Such den Schlüssel und dann den Schatz!' : '');
  }));
  document.querySelectorAll('.pad button').forEach(b => b.addEventListener('pointerdown', e => { e.preventDefault(); move(+b.dataset.d); }));
  window.addEventListener('keydown', e => {
    const map = { ArrowUp: 0, ArrowRight: 1, ArrowDown: 2, ArrowLeft: 3, w: 0, d: 1, s: 2, a: 3 };
    if (e.key in map && $('game').classList.contains('active')) { e.preventDefault(); move(map[e.key]); }
  });
  let sx = null, sy = null;
  const wrap = $('wrap');
  wrap.addEventListener('touchstart', e => { sx = e.touches[0].clientX; sy = e.touches[0].clientY; audio(); }, { passive: true });
  wrap.addEventListener('touchend', e => {
    if (sx === null) return;
    const dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy;
    sx = sy = null;
    if (Math.max(Math.abs(dx), Math.abs(dy)) < 20) return;
    if (Math.abs(dx) > Math.abs(dy)) move(dx > 0 ? 1 : 3); else move(dy > 0 ? 2 : 0);
  });
  $('back').onclick = () => { busy = false; show('start'); };
  $('newmaze').onclick = () => { if (!busy) generate(); };
  $('next').onclick = () => { endParty(); level++; generate(); };
  $('other').onclick = () => { endParty(); show('start'); };
  window.addEventListener('resize', () => { if (walls) resize(); sizeFx(); });
})();
</script>
</body>
</html>
